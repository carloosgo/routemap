name: Apply App state lifecycle fix

on:
  push:
    branches: [agent/phase-1-no-design]
    paths:
      - .github/workflows/patch-app-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-no-design
          fetch-depth: 0

      - name: Move state update into an effect
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          content = path.read_text(encoding='utf-8')
          old = """  const prevTripIdRef = useRef(trip.id);
  if (prevTripIdRef.current !== trip.id) {
    prevTripIdRef.current = trip.id;
    const collapsed = {};
    (trip.segments || []).forEach((s) => {
      collapsed[s.id] = false;
    });
    setExpandedSegments(collapsed);
  }
"""
          new = """  const prevTripIdRef = useRef(trip.id);
  useEffect(() => {
    if (prevTripIdRef.current === trip.id) return;

    prevTripIdRef.current = trip.id;
    const collapsed = {};
    (trip.segments || []).forEach((s) => {
      collapsed[s.id] = false;
    });
    setExpandedSegments(collapsed);
  }, [trip.id, trip.segments]);
"""

          if old not in content:
              raise SystemExit('Expected App.jsx block was not found; refusing to modify the file.')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')

      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Move trip expansion reset into effect"
          git push origin HEAD:agent/phase-1-no-design
