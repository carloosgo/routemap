name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/phase-1-no-design
      - agent/phase-2-hardening-no-design
      - agent/phase-3-firebase-foundation

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce design-preservation contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          stylesheet_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)([^/]+\.(css|scss|sass|less)|styles?/)' || true)"

          if [ -n "$stylesheet_files" ]; then
            if ! printf '%s\n' "$changed_files" | grep -qx 'DESIGN_PRESERVATION.md'; then
              echo "Stylesheet changes require DESIGN_PRESERVATION.md in the same PR."
              printf '%s\n' "$stylesheet_files"
              exit 1
            fi

            if ! grep -q '^Visual delta: none$' DESIGN_PRESERVATION.md; then
              echo "DESIGN_PRESERVATION.md must declare: Visual delta: none"
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"

          if npm test 2>&1 | tee "$log_file"; then
            exit 0
          fi

          node - "$log_file" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
          const failureStarts = [];
          for (let index = 0; index < lines.length; index += 1) {
            if (/^not ok\s+\d+\s+-\s+/.test(lines[index])) failureStarts.push(index);
          }

          const blocks = failureStarts.map((start, position) => {
            const next = failureStarts[position + 1] ?? lines.length;
            let end = Math.min(next, start + 45);
            for (let index = start + 1; index < end; index += 1) {
              if (/^# Subtest: /.test(lines[index]) || /^ok\s+\d+\s+-\s+/.test(lines[index])) {
                end = index;
                break;
              }
            }
            return lines.slice(start, end).join('\n').trim();
          }).filter(Boolean);

          const selected = blocks.length > 0
            ? blocks
            : [lines.slice(-120).join('\n').trim()];

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(
            summaryPath,
            `### Unit test failure blocks\n\n\`\`\`text\n${selected.join('\n\n---\n\n')}\n\`\`\`\n`
          );

          for (const block of selected) {
            const escaped = block
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A');
            console.log(`::error title=Unit test failure::${escaped}`);
          }
          NODE
          exit 1

      - name: Test Firestore security rules
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"

          if npm run test:rules 2>&1 | tee "$log_file"; then
            exit 0
          fi

          tail_text="$(tail -n 80 "$log_file")"
          {
            echo "### Firestore security rules failure"
            echo '```text'
            printf '%s\n' "$tail_text"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          escaped="$tail_text"
          escaped="${escaped//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          echo "::error title=Firestore security rules failed::$escaped"
          exit 1

      - name: Test scoped Phase K E2E Firestore rules
        run: npm run test:rules:phase-k-e2e

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
