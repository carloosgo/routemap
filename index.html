    <!--
      NOTA DE SEGURIDAD:
      La Content-Security-Policy real debe definirse como CABECERA HTTP en el
      servidor/CDN de producción (más fuerte que el <meta>). Aquí se incluye
      una base para entornos donde no controlas las cabeceras.
      Ajusta los dominios de tiles/geocoder si cambias de proveedor.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https://*.mapbox.com https://flagcdn.com; connect-src 'self' https://nominatim.openstreetmap.org https://*.mapbox.com https://events.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; script-src 'self' blob: https://*.mapbox.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />
    <link rel="icon" href="/atlas-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Atlas · Rutas de viaje</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
