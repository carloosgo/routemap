name: Dependency audit

on:
  push:
    branches:
      - main
      - agent/phase-2-hardening-no-design
      - agent/phase-3-firebase-foundation
  pull_request:
    branches:
      - main
      - agent/phase-1-no-design
      - agent/phase-2-hardening-no-design
  schedule:
    - cron: '41 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm audit client
        run: npm install --global npm@12.0.2

      - name: Verify npm audit client
        run: test "$(npm --version)" = "12.0.2"

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Audit production dependencies
        shell: bash
        run: |
          audit_with_transient_retry() {
            local label="$1"
            shift
            local attempt=1
            local max_attempts=3
            local output
            local status
            local delay_seconds

            while true; do
              set +e
              output="$("$@" 2>&1)"
              status=$?
              set -e

              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if ! printf '%s\n' "$output" | grep -Eiq 'npm warn audit (500|502|503|504)( |$)|EAI_AGAIN|ECONNRESET|ECONNREFUSED|ETIMEDOUT|ENETUNREACH|socket hang up'; then
                return "$status"
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                return "$status"
              fi

              delay_seconds=$((attempt * 15))
              echo "::warning::Transient npm audit failure for ${label} (attempt ${attempt}/${max_attempts}); retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          audit_with_transient_retry application npm audit --omit=dev --audit-level=high
          audit_with_transient_retry functions npm audit --prefix functions --omit=dev --audit-level=high
