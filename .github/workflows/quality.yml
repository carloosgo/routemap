name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/phase-1-no-design
      - agent/phase-2-hardening-no-design
      - agent/phase-3-firebase-foundation

permissions:
  contents: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Enforce design-preservation contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          stylesheet_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)([^/]+\.(css|scss|sass|less)|styles?/)' || true)"

          if [ -n "$stylesheet_files" ]; then
            if ! printf '%s\n' "$changed_files" | grep -qx 'DESIGN_PRESERVATION.md'; then
              echo "Stylesheet changes require DESIGN_PRESERVATION.md in the same PR."
              printf '%s\n' "$stylesheet_files"
              exit 1
            fi

            if ! grep -q '^Visual delta: none$' DESIGN_PRESERVATION.md; then
              echo "DESIGN_PRESERVATION.md must declare: Visual delta: none"
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sincroniza package-lock con MapLibre"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
