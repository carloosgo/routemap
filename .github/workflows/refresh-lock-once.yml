name: Refresh lockfile once

on:
  push:
    branches:
      - agent/post-preprod-cleanup

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-preprod-cleanup

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lock and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-lock-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were required."
            exit 0
          fi
          git commit -m "Refresh lockfile after MapLibre removal"
          git push origin HEAD:agent/post-preprod-cleanup
