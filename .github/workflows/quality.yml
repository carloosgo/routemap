name: Quality checks

on:
  pull_request:
  push:
    branches: [main, agent/phase-1-no-design, agent/phase-2-hardening-no-design]

permissions:
  contents: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Apply exact App interaction extraction
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          content = path.read_text(encoding='utf-8')

          replacements = [
            (
              "import { useState, useEffect, useCallback, useRef } from 'react';",
              "import { useState, useCallback, useRef } from 'react';",
            ),
            (
              "import { colorForIndex } from './config.js';\n",
              "import { colorForIndex } from './config.js';\nimport {\n  useCollapseSegmentsOnTripChange,\n  useOutsideClick,\n  useSaveShortcut,\n} from './app/useAppInteractions.js';\n",
            ),
            (
              """  useEffect(() => {
            function onKey(e) {
              if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                handleSave();
              }
            }
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [handleSave]);

          // Cierra cualquier dropdown de la barra superior al hacer clic afuera.
          useEffect(() => {
            function onClickOutside(e) {
              if (menuWrapRef.current && !menuWrapRef.current.contains(e.target)) {
                setOpenMenu(null);
              }
            }
            if (openMenu) {
              document.addEventListener('mousedown', onClickOutside);
              return () => document.removeEventListener('mousedown', onClickOutside);
            }
          }, [openMenu]);

          const prevTripIdRef = useRef(trip.id);

          useEffect(() => {
          if (prevTripIdRef.current === trip.id) return;

          prevTripIdRef.current = trip.id;
          const collapsed = {};
          (trip.segments || []).forEach((s) => {
            collapsed[s.id] = false;
          });
          setExpandedSegments(collapsed);
        }, [trip.id, trip.segments]);
""",
              """  useSaveShortcut(handleSave);
          useOutsideClick(menuWrapRef, Boolean(openMenu), () => setOpenMenu(null));
          useCollapseSegmentsOnTripChange(trip.id, trip.segments, setExpandedSegments);
""",
            ),
          ]

          for old, new in replacements:
            if content.count(old) != 1:
              raise SystemExit(f'Expected one match, found {content.count(old)}: {old[:80]!r}')
            content = content.replace(old, new, 1)

          path.write_text(content, encoding='utf-8')

      - name: Validate non-visual scope
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "src/App.jsx"
          ! git diff -- src/App.jsx | grep -E '^[-+].*(className=|<header|<section|<main|<nav|App\.css)' || {
            echo 'Visible JSX or CSS-related line changed unexpectedly.'
            exit 1
          }

      - name: Restore CI and commit extraction
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          cat > .github/workflows/quality.yml <<'YAML'
          name: Quality checks

          on:
            pull_request:
            push:
              branches: [main, agent/phase-1-no-design, agent/phase-2-hardening-no-design]

          permissions:
            contents: read

          jobs:
            test-lint-build:
              runs-on: ubuntu-latest
              timeout-minutes: 10

              steps:
                - name: Checkout repository
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Enforce frozen design scope
                  if: github.event_name == 'pull_request'
                  shell: bash
                  run: |
                    changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
                    forbidden_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)([^/]+\.(css|scss|sass|less)|styles?/)' || true)"

                    if [ -n "$forbidden_files" ]; then
                      echo "This phase does not allow visual-design or stylesheet changes:"
                      printf '%s\n' "$forbidden_files"
                      exit 1
                    fi

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Run tests
                  run: npm test

                - name: Run ESLint
                  run: npm run lint

                - name: Build production bundle
                  run: npm run build
          YAML
          rm -f .github/workflows/app-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/quality.yml .github/workflows/app-refactor-once.yml
          git commit -m "Extract App interaction effects"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
