name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/phase-1-no-design]

permissions:
  contents: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Apply non-visual App cleanup
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.jsx')
          content = path.read_text(encoding='utf-8')
          content = content.replace('  IconNote,\n', '', 1)

          old = """useEffect(() => {
            if (prevTripIdRef.current === trip.id) return;

            prevTripIdRef.current = trip.id;
            const collapsed = {};
            (trip.segments || []).forEach((s) => {
              collapsed[s.id] = false;
            });
            setExpandedSegments(collapsed);
          }, [trip.id, trip.segments]);
          """
          new = """  useEffect(() => {
            if (prevTripIdRef.current === trip.id) return;

            prevTripIdRef.current = trip.id;
            const collapsed = {};
            (trip.segments || []).forEach((s) => {
              collapsed[s.id] = false;
            });
            setExpandedSegments(collapsed);
          }, [trip.id, trip.segments]);
          """
          content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')

      - name: Commit non-visual App cleanup
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Clean App lifecycle code"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Enforce frozen design scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          forbidden_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)([^/]+\.(css|scss|sass|less)|styles?/)' || true)"

          if [ -n "$forbidden_files" ]; then
            echo "This phase does not allow visual-design or stylesheet changes:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
