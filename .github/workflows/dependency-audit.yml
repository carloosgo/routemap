name: Dependency audit

on:
  push:
    branches:
      - main
      - agent/phase-2-hardening-no-design
      - agent/phase-3-firebase-foundation
  pull_request:
    branches:
      - main
      - agent/phase-1-no-design
      - agent/phase-2-hardening-no-design
  schedule:
    - cron: '41 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Pin npm audit client
        run: npm install --global npm@12.0.2

      - name: Verify npm audit client
        run: test "$(npm --version)" = "12.0.2"

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Audit application production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Functions production dependencies
        run: npm audit --prefix functions --omit=dev --audit-level=high
