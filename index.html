    <!--
      NOTA DE SEGURIDAD:
      La Content-Security-Policy real debe definirse como CABECERA HTTP en el
      servidor/CDN de producción (más fuerte que el <meta>). Aquí se incluye
      una base para entornos donde no controlas las cabeceras.
      frame-ancestors solo funciona como cabecera HTTP y se configurará al desplegar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https://*.geoapify.com https://flagcdn.com https://lh3.googleusercontent.com https://upload.wikimedia.org https://*.wikimedia.org; connect-src 'self' https://*.geoapify.com https://nominatim.openstreetmap.org https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://*.cloudfunctions.net https://stac.overturemaps.org https://tiles.overturemaps.org https://overturemaps-extras-us-west-2.s3.amazonaws.com https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; child-src 'self' blob: https://accounts.google.com https://*.firebaseapp.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; script-src 'self' blob: https://apis.google.com; base-uri 'self'; form-action 'self' https://accounts.google.com;"
    />
