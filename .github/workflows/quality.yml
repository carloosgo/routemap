name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - agent/phase-1-no-design
      - agent/phase-2-hardening-no-design
      - agent/phase-3-firebase-foundation

permissions:
  contents: write

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Apply one-time stabilization
        if: github.actor != 'github-actions[bot]'
        run: python scripts/stabilize_once.py

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit stabilization changes
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No stabilization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Estabiliza CI y contrato de datos"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install application dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run unit tests
        run: npm test

      - name: Test Firestore security rules
        run: npm run test:rules

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
