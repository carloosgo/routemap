name: Quality checks

on:
  pull_request:
  push:
    branches: [main, agent/phase-1-no-design, agent/phase-2-hardening-no-design]

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce frozen design scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          forbidden_files="$(printf '%s\n' "$changed_files" | grep -E '(^|/)([^/]+\.(css|scss|sass|less)|styles?/)' || true)"

          if [ -n "$forbidden_files" ]; then
            echo "This phase does not allow visual-design or stylesheet changes:"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
